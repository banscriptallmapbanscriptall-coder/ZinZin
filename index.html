<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZinZin AI - Trợ lý thông minh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        sidebarBg: '#1e293b',
                        cardBg: '#334155',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown & Code highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .pulse-dot { animation: pulse 1.4s infinite ease-in-out both; }
        .pulse-dot:nth-child(1) { animation-delay: -0.32s; }
        .pulse-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        pre code { display: block; overflow-x: auto; padding: 1rem; background: #090d16; border-radius: 0.75rem; color: #e2e8f0; font-family: monospace; }
        .code-block-wrapper { position: relative; margin: 1rem 0; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #3b82f6; color: white; padding: 4px 8px; font-size: 12px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .copy-btn:hover { background: #2563eb; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 bg-sidebarBg flex flex-col border-r border-slate-800 transition-all duration-300 z-20">
        <!-- Logo & New Chat -->
        <div class="p-4 border-b border-slate-700/50 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-xl shadow-lg">
                    Z
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">ZinZin AI</h1>
                    <span class="text-xs text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle text-[8px]"></i> Sẵn sàng</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white md:hidden">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div class="p-4">
            <button onclick="createNewChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 transition-all">
                <i class="fa-solid fa-plus"></i> Cuộc trò chuyện mới
            </button>
        </div>

        <!-- Chat History List -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 space-y-1.5" id="chatList">
            <!-- Dynamically filled -->
        </div>

        <!-- User Profile / Google Login Section -->
        <div class="p-4 border-t border-slate-700/50 bg-slate-900/40">
            <div id="authSection">
                <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-100 text-slate-800 font-medium py-2 px-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow transition">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google"> Đăng nhập Google
                </button>
            </div>
            <div id="userProfile" class="hidden flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img id="userAvatar" src="" class="w-9 h-9 rounded-full border border-indigo-500" alt="Avatar">
                    <div class="overflow-hidden">
                        <p id="userName" class="text-sm font-semibold truncate text-slate-200"></p>
                        <p class="text-xs text-slate-400 truncate">Tài khoản Google</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-rose-400 p-1" title="Đăng xuất">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full bg-darkBg relative">
        <!-- Top Navbar -->
        <header class="h-16 border-b border-slate-800 flex items-center justify-between px-4 bg-darkBg/80 backdrop-blur sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <!-- Model Selector -->
                <div class="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700">
                    <select id="modelSelect" class="bg-transparent text-sm font-medium text-slate-200 px-3 py-1.5 outline-none cursor-pointer">
                        <option value="gemini-4-argon">Gemini 4 (Argon)</option>
                        <option value="claude-opus-5-5">Claude 5.5 Opus</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">Gateway Active</span>
            </div>
        </header>

        <!-- Messages Container -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 custom-scrollbar">
            <!-- Welcome Screen -->
            <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto space-y-4">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-3xl font-bold shadow-xl shadow-indigo-500/20">
                    Z
                </div>
                <h2 class="text-2xl font-bold text-white">Chào mừng bạn đến với ZinZin AI!</h2>
                <p class="text-sm text-slate-400">Trợ lý AI thông minh hỗ trợ lập trình, giải đáp thắc mắc và sáng tạo nội dung với Gemini 4 và Claude 5.5 Opus.</p>
                <div class="grid grid-cols-2 gap-2 w-full pt-4">
                    <button onclick="sendQuickPrompt('Viết code Python tạo ứng dụng web đơn giản')" class="p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-xl text-xs text-left text-slate-300 transition">💻 Viết code Python web app</button>
                    <button onclick="sendQuickPrompt('Giải thích cách hoạt động của AI')" class="p-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-xl text-xs text-left text-slate-300 transition">🧠 Giải thích công nghệ AI</button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-darkBg border-t border-slate-800">
            <div class="max-w-4xl mx-auto">
                <form id="chatForm" onsubmit="handleSendMessage(event)" class="relative flex items-center bg-slate-800/90 border border-slate-700/80 rounded-2xl shadow-lg focus-within:border-indigo-500 transition-all">
                    <textarea id="userInput" rows="1" placeholder="Nhắn tin cho ZinZin AI... (Nhấn Shift + Enter để xuống dòng)" class="w-full bg-transparent text-slate-100 placeholder-slate-400 text-sm px-4 py-3.5 outline-none resize-none max-h-36 custom-scrollbar"></textarea>
                    <button type="submit" id="sendBtn" class="m-2 bg-indigo-600 hover:bg-indigo-500 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
                <div class="text-center mt-2">
                    <p class="text-[11px] text-slate-500">ZinZin AI có thể tạo ra thông tin không chính xác. Hãy kiểm tra các đoạn mã quan trọng.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // API Keys cấu hình
        const API_KEYS = {
            "gemini-4-argon": "sk-live-99b6aa7022a6f990b6ee62129c6ff9c9",
            "claude-opus-5-5": "sk-live-99e192f9da55c06fc4e9f673dd8f0b00"
        };

        const GATEWAY_URL = "https://literouter.fun/v1/chat/completions";

        let chats = JSON.parse(localStorage.getItem('zinzin_chats')) || [];
        let currentChatId = localStorage.getItem('zinzin_current_id') || null;

        // Khởi tạo ứng dụng
        document.addEventListener('DOMContentLoaded', () => {
            renderChatList();
            if (chats.length > 0 && currentChatId) {
                loadChat(currentChatId);
            } else if (chats.length > 0) {
                loadChat(chats[0].id);
            }
            checkSavedUser();

            // Auto-resize textarea
            const textarea = document.getElementById('userInput');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('chatForm').dispatchEvent(new Event('submit'));
                }
            });
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-ml-72');
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Cuộc trò chuyện mới',
                messages: []
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveAndRender();
            clearChatUI();
        }

        function saveAndRender() {
            localStorage.setItem('zinzin_chats', JSON.stringify(chats));
            localStorage.setItem('zinzin_current_id', currentChatId);
            renderChatList();
        }

        function renderChatList() {
            const listEl = document.getElementById('chatList');
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-2.5 rounded-xl text-sm cursor-pointer transition ${isActive ? 'bg-indigo-600/20 text-indigo-300 font-medium border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800/60'}`;
                div.onclick = () => loadChat(chat.id);
                div.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate">
                        <i class="fa-regular fa-message text-xs"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-400 p-1">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                listEl.appendChild(div);
            });
        }

        function loadChat(id) {
            currentChatId = id;
            localStorage.setItem('zinzin_current_id', currentChatId);
            renderChatList();
            const chat = chats.find(c => c.id === id);
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            if (!chat || chat.messages.length === 0) {
                showWelcome(true);
                return;
            }

            showWelcome(false);
            chat.messages.forEach(msg => {
                appendMessageToUI(msg.role, msg.content, false);
            });
            scrollToBottom();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = chats.length > 0 ? chats[0].id : null;
            }
            saveAndRender();
            if (currentChatId) {
                loadChat(currentChatId);
            } else {
                createNewChat();
            }
        }

        function showWelcome(show) {
            let welcome = document.getElementById('welcomeScreen');
            if (show) {
                if (!welcome) {
                    location.reload();
                } else {
                    welcome.style.display = 'flex';
                }
            } else {
                if (welcome) welcome.style.display = 'none';
            }
        }

        function clearChatUI() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = `
                <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-3xl font-bold shadow-xl shadow-indigo-500/20">Z</div>
                    <h2 class="text-2xl font-bold text-white">ZinZin AI luôn sẵn sàng!</h2>
                    <p class="text-sm text-slate-400">Hãy đặt câu hỏi hoặc yêu cầu viết code bất kỳ.</p>
                </div>
            `;
        }

        function sendQuickPrompt(promptText) {
            document.getElementById('userInput').value = promptText;
            document.getElementById('chatForm').dispatchEvent(new Event('submit'));
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!currentChatId) {
                createNewChat();
            }

            let chat = chats.find(c => c.id === currentChatId);
            if (chat && chat.messages.length === 0) {
                chat.title = text.length > 30 ? text.substring(0, 30) + '...' : text;
            }

            input.value = '';
            input.style.height = 'auto';
            showWelcome(false);

            // Thêm tin nhắn user vào state & UI
            chat.messages.push({ role: 'user', content: text });
            appendMessageToUI('user', text, true);
            saveAndRender();

            // Tạo khung suy nghĩ (Thinking animation)
            const thinkingId = 'thinking_' + Date.now();
            appendThinkingUI(thinkingId);
            scrollToBottom();

            const selectedModel = document.getElementById('modelSelect').value;
            const apiKey = API_KEYS[selectedModel];

            try {
                const response = await fetch(GATEWAY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: [
                            { role: "system", content: "Bạn là trợ lý AI chuyên nghiệp có tên là ZinZin, hỗ trợ viết code xuất sắc, tư duy logic và trình bày đẹp mắt." },
                            ...chat.messages.map(m => ({ role: m.role, content: m.content }))
                        ],
                        temperature: 0.7,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`Lỗi kết nối Gateway (${response.status})`);
                }

                // Xóa khung suy nghĩ
                removeElement(thinkingId);

                // Tạo khung AI response streaming
                const aiMsgId = 'ai_' + Date.now();
                appendMessageToUI('assistant', '', true, aiMsgId);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                let fullContent = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith("data: ")) {
                            const dataStr = trimmed.substring(6);
                            if (dataStr === "[DONE]") break;
                            try {
                                const json = JSON.parse(dataStr);
                                const chunk = json.choices[0]?.delta?.content || "";
                                if (chunk) {
                                    fullContent += chunk;
                                    updateAiMessageContent(aiMsgId, fullContent);
                                    scrollToBottom();
                                }
                            } catch (err) {}
                        }
                    }
                }

                chat.messages.push({ role: 'assistant', content: fullContent });
                saveAndRender();

            } catch (error) {
                removeElement(thinkingId);
                const errorMsg = `⚠️ **Lỗi kết nối:** ${error.message}. Vui lòng thử lại sau.`;
                appendMessageToUI('assistant', errorMsg, true);
                chat.messages.push({ role: 'assistant', content: errorMsg });
                saveAndRender();
            }
        }

        function appendMessageToUI(role, content, saveToState = false, customId = null) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            if (customId) div.id = customId;
            div.className = `flex gap-4 max-w-4xl mx-auto w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            if (role === 'user') {
                div.innerHTML = `
                    <div class="bg-indigo-600 text-white px-4 py-3 rounded-2xl rounded-tr-none max-w-[85%] md:max-w-[75%] text-sm shadow-md whitespace-pre-wrap leading-relaxed">${escapeHtml(content)}</div>
                    <div class="w-8 h-8 rounded-full bg-indigo-500/30 flex items-center justify-center text-xs font-bold shrink-0 border border-indigo-500/40">Bạn</div>
                `;
            } else {
                const formattedHtml = formatMarkdown(content);
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-xs font-bold shrink-0 shadow">Z</div>
                    <div class="bg-slate-800/90 border border-slate-700/60 text-slate-200 px-5 py-4 rounded-2xl rounded-tl-none max-w-[90%] md:max-w-[85%] text-sm shadow-md leading-relaxed message-content">${formattedHtml}</div>
                `;
            }
            container.appendChild(div);
            addCopyButtonsToCodeBlocks(div);
        }

        function appendThinkingUI(id) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.id = id;
            div.className = `flex gap-4 max-w-4xl mx-auto w-full justify-start`;
            div.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-xs font-bold shrink-0 shadow animate-pulse">Z</div>
                <div class="bg-slate-800/80 border border-slate-700/60 px-4 py-3 rounded-2xl rounded-tl-none flex items-center gap-2">
                    <span class="text-xs text-slate-300 font-medium">ZinZin đang suy nghĩ</span>
                    <div class="flex gap-1">
                        <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full pulse-dot"></div>
                        <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full pulse-dot"></div>
                        <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full pulse-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function updateAiMessageContent(id, content) {
            const el = document.getElementById(id);
            if (el) {
                const contentDiv = el.querySelector('.message-content');
                if (contentDiv) {
                    contentDiv.innerHTML = formatMarkdown(content);
                    addCopyButtonsToCodeBlocks(contentDiv);
                }
            }
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function formatMarkdown(text) {
            if (!text) return '';
            try {
                return marked.parse(text);
            } catch (e) {
                return escapeHtml(text);
            }
        }

        function addCopyButtonsToCodeBlocks(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (!pre.parentElement.classList.contains('code-block-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(pre);

                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.innerHTML = '<i class="fa-regular fa-copy"></i> Sao chép';
                    btn.onclick = () => {
                        const code = pre.querySelector('code') || pre;
                        navigator.clipboard.writeText(code.innerText);
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã chép!';
                        setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i> Sao chép', 2000);
                    };
                    wrapper.appendChild(btn);
                }
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Đăng nhập Google giả lập mượt mà
        function loginWithGoogle() {
            const mockUser = {
                name: "Người dùng ZinZin",
                avatar: "https://lh3.googleusercontent.com/a/ACg8ocJ3v...=s96-c"
            };
            // Fallback avatar đẹp
            mockUser.avatar = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces";
            
            localStorage.setItem('zinzin_user', JSON.stringify(mockUser));
            updateAuthUI(mockUser);
        }

        function checkSavedUser() {
            const saved = localStorage.getItem('zinzin_user');
            if (saved) {
                updateAuthUI(JSON.parse(saved));
            }
        }

        function updateAuthUI(user) {
            document.getElementById('authSection').classList.add('hidden');
            const profile = document.getElementById('userProfile');
            profile.classList.remove('hidden');
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userAvatar').src = user.avatar;
        }

        function logout() {
            localStorage.removeItem('zinzin_user');
            document.getElementById('userProfile').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
